name: "🔮 RV · 🧪 CI · Validate"
run-name: "🧪 CI · ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }} · ${{ github.event_name }}"

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'bridges/**'
      - 'gpu/**'
      - 'packages/**'
      - 'tests/**'
      - 'infra/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.env.example'
      - 'cloudbuild.yaml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/validate-ci.yml'
      - '.github/actions/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      scope:
        description: "Contexto a executar"
        type: choice
        required: true
        default: all
        options: [all, auto, python, frontend, frontend-web, frontend-manage, integration, containers, security, bootstrap, compose, icloud, diagnostics]
      upload_artifacts:
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: "🧭 Detectar contexto e pacotes alterados"
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.actor != 'renovate[bot]' &&
           github.actor != 'dependabot[bot]' &&
           github.event.pull_request.user.login != 'renovate[bot]' &&
           github.event.pull_request.user.login != 'dependabot[bot]' &&
           github.event.head_commit.author.username != 'renovate[bot]' &&
           github.event.head_commit.author.username != 'dependabot[bot]' &&
           github.event.head_commit.committer.username != 'renovate[bot]' &&
           github.event.head_commit.committer.username != 'dependabot[bot]' &&
           !contains(github.event.head_commit.message, 'dependabot[bot]') &&
           !contains(github.event.head_commit.message, 'renovate[bot]')) }}
    outputs:
      python: ${{ steps.scope.outputs.python }}
      integration: ${{ steps.scope.outputs.integration }}
      containers: ${{ steps.scope.outputs.containers }}
      security: ${{ steps.scope.outputs.security }}
      py_api: ${{ steps.scope.outputs.py_api }}
      py_manage: ${{ steps.scope.outputs.py_manage }}
      py_gpu: ${{ steps.scope.outputs.py_gpu }}
      py_bridges: ${{ steps.scope.outputs.py_bridges }}
      front_web: ${{ steps.scope.outputs.front_web }}
      front_manage: ${{ steps.scope.outputs.front_manage }}
      frontend_matrix: ${{ steps.scope.outputs.frontend_matrix }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: "🧭 Select affected jobs"
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ contains(fromJSON('["bootstrap","compose","icloud","diagnostics"]'), inputs.scope) && 'auto' || inputs.scope || 'auto' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci/select-context.ts

  validate:
    needs: changes
    uses: ./.github/workflows/_validate-ci.yml
    with:
      event_name: ${{ github.event_name }}
      scope: ${{ inputs.scope || 'auto' }}
      upload_artifacts: ${{ inputs.upload_artifacts || false }}
      base_sha: ${{ needs.changes.outputs.base_sha || github.event.pull_request.base.sha || github.event.before }}
      head_sha: ${{ needs.changes.outputs.head_sha || github.sha }}
      python: ${{ needs.changes.outputs.python }}
      integration: ${{ needs.changes.outputs.integration }}
      containers: ${{ needs.changes.outputs.containers }}
      security: ${{ needs.changes.outputs.security }}
      py_api: ${{ needs.changes.outputs.py_api }}
      py_manage: ${{ needs.changes.outputs.py_manage }}
      py_gpu: ${{ needs.changes.outputs.py_gpu }}
      py_bridges: ${{ needs.changes.outputs.py_bridges }}
      front_web: ${{ needs.changes.outputs.front_web }}
      front_manage: ${{ needs.changes.outputs.front_manage }}
      frontend_matrix: ${{ needs.changes.outputs.frontend_matrix }}
    secrets: inherit

  publish-preview:
    needs: [changes, validate]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.changes.outputs.front_web == 'true' || needs.changes.outputs.front_manage == 'true') &&
      needs.validate.result == 'success'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: ./.github/workflows/cloudflare-pr-previews.yml
    with:
      reuse_build: true
    secrets: inherit
